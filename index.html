<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fondamenti di Informatica</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

<!-- Favicon -->
<link rel="icon" type="image/png" href="./logo/black%20code.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="./logo/white%20code.png" media="(prefers-color-scheme: dark)">  

<!--CSS -->
<link rel="stylesheet" href="style.css" >

<!-- defer significa che lo script viene caricato in background, dopo che HTML è stato caricato -->
<script src="script.js" defer></script> 

</head>
<body>

<header class="topbar">
  <button class="brand-btn" id="modeBtn" aria-label="Cambia sezione degli appunti" aria-expanded="false" aria-controls="modeMenu" aria-haspopup="menu">
    <span class="brand">Fondamenti di Informatica</span>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <button class="aa" id="aaBtn" aria-label="Aspetto e dimensione testo" aria-expanded="false" aria-controls="settings">
    <span class="s">a</span><span class="l">A</span>
  </button>
</header>

<div class="settings" id="settings" hidden>
  <div class="row">
    <span class="lbl">Dimensione testo</span>
    <div class="stepper">
      <button id="zMinus" aria-label="Riduci dimensione testo">&minus;</button>
      <output id="zVal">100%</output>
      <button id="zPlus" aria-label="Aumenta dimensione testo">+</button>
    </div>
    <button class="reset" id="zReset" disabled>Reset</button>
  </div>
  <div class="row">
    <span class="lbl">Theme</span>
    <div class="themes">
      <button class="th" data-theme-btn="light" aria-pressed="true" aria-label="Tema chiaro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
        <span class="rd"></span>
      </button>
      <button class="th" data-theme-btn="dark" aria-pressed="false" aria-label="Tema scuro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
        <span class="rd"></span>
      </button>
    </div>
  </div>
  <div class="row">
    <span class="lbl">Code theme</span>
    <div class="themes col">
      <button class="th cth" data-code-btn="default" aria-pressed="true" type="button">
        <span class="cdots" data-dots="default"></span><span class="cl">Default</span><span class="rd"></span>
      </button>
      <button class="th cth" data-code-btn="codeblocks" aria-pressed="false" type="button">
        <span class="cdots" data-dots="codeblocks"></span><span class="cl">Codeblocks</span><span class="rd"></span>
      </button>
      <button class="th cth" data-code-btn="custom" aria-pressed="false" type="button">
        <span class="cdots" data-dots="custom"></span>
        <span class="cl">Custom
          <svg class="edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </span><span class="rd"></span>
      </button>
    </div>
    <p class="chint" id="codeHint" hidden>Tocca di nuovo Custom per modificare i colori.</p>
  </div>
</div>

<div class="mode-menu" id="modeMenu" role="menu" hidden></div>

<main id="content" aria-live="polite"></main>

<div class="day-menu" id="dayMenu" role="menu" hidden></div>

<div class="toc" id="tocPanel" hidden></div>

<div class="dock" id="dock">
<nav class="nav" id="navBar" aria-label="Navigazione tra i Day">
  <button class="arrow" id="prevBtn" aria-label="Day precedente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="dots" id="dotsBtn" aria-label="Scegli il Day" aria-expanded="false" aria-controls="dayMenu"></button>
  <button class="arrow" id="nextBtn" aria-label="Day successivo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</nav>
  <button class="toc-fab" id="tocBtn" aria-label="Indice della pagina" aria-expanded="false" aria-controls="tocPanel" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>
  </button>
</div>


<!-- Finestra "Colori del codice" (si apre toccando di nuovo Custom nel menu aA) -->
<div class="cmodal" id="codeModal" hidden>
  <div class="cm-back" data-close></div>
  <div class="cm-dialog" id="cmDialog" role="dialog" aria-modal="true" aria-labelledby="cmTitle" tabindex="-1">
    <div class="cm-head">
      <div>
        <div class="cm-title" id="cmTitle">Colori del codice</div>
        <div class="cm-sub">Tema Custom &middot; le modifiche si salvano da sole</div>
      </div>
      <button class="cm-x" id="cmClose" type="button" aria-label="Chiudi">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="cm-body">
      <div class="cm-prev">
        <div class="cm-cap">Anteprima &middot; tocca un elemento per cambiarne il colore</div>
        <pre id="cmPreview"><code class="nohl"></code></pre>
      </div>
      <div class="cm-list" id="cmList"></div>
    </div>
    <div class="cm-foot">
      <button class="cm-btn" id="cmReset" type="button">Ripristina</button>
      <button class="cm-btn primary" id="cmDone" type="button">Fine</button>
    </div>
  </div>

  <div class="cpop" id="colorPop" role="dialog" aria-label="Scegli il colore" hidden>
    <div class="cp-title"><span class="cp-dot" id="cpDot"></span><span id="cpTitle"></span></div>
    <div class="cp-sv" id="cpSV" tabindex="0" aria-label="Saturazione e luminosit&agrave; (usa le frecce)"><div class="cp-knob"></div></div>
    <div class="cp-hue" id="cpHue" tabindex="0" role="slider" aria-label="Tonalit&agrave;" aria-valuemin="0" aria-valuemax="360" aria-valuenow="0"><div class="cp-knob"></div></div>
    <div class="cp-row"><span class="cp-lbl">HEX</span><input class="cp-in" id="cpHex" type="text" maxlength="7" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Colore esadecimale"></div>
    <div class="cp-row"><span class="cp-lbl">RGB</span>
      <input class="cp-in cp-n" type="text" inputmode="numeric" maxlength="3" autocomplete="off" aria-label="Rosso, da 0 a 255">
      <input class="cp-in cp-n" type="text" inputmode="numeric" maxlength="3" autocomplete="off" aria-label="Verde, da 0 a 255">
      <input class="cp-in cp-n" type="text" inputmode="numeric" maxlength="3" autocomplete="off" aria-label="Blu, da 0 a 255">
    </div>
    <div class="cp-row"><span class="cp-lbl">BIN</span><code class="cp-bin" id="cpBin" title="R G B in binario a 8 bit"></code></div>
  </div>
</div>


<!-- =====================================================================
     APPUNTI
     Gli appunti NON stanno in questo file: ogni giornata è un frammento
     HTML nella cartella appunti/, caricato da script.js con fetch().
     Due sezioni, selezionabili dal menu sul nome della materia (in alto a sinistra):
       - Lezioni:       appunti/day-01.html, day-02.html, ...
       - Esercitazioni: appunti/esercitazione-1.html, ...
     Per aggiungere un nuovo appunto: duplica appunti/_template-day.html,
     rinominalo e registralo nel catalogo giusto ("days" oppure "esercitazioni")
     in script.js, con n, title, file e date. Pallini e menu si aggiornano da soli.
     ===================================================================== -->

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>


</body>
</html>
